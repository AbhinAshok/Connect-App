version: '3.8'

services:
  # PostgreSQL with PostGIS extension for spatial queries (Event distance calculations)
  postgres:
    image: postgis/postgis:16-3.4
    container_name: friend_app_postgres
    restart: always
    environment:
      POSTGRES_DB: friend_app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis for ultra-low latency matchmaking queues and WebRTC room state
  redis:
    image: redis:7-alpine
    container_name: friend_app_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
